[project]
name = "amazon-bedrock-nova-chatbot"
version = "0.1.0"
description = "A minimal, heavily commented command-line chatbot for Amazon Nova on Bedrock"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # 1.39 added Bedrock API key (AWS_BEARER_TOKEN_BEDROCK) support.
    "boto3>=1.40",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
